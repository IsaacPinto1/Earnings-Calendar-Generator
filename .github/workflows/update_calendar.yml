name: Update Earnings Calendar

on:
  schedule:
    - cron: "0 13 * * *"  # Runs daily at 6am PT (13:00 UTC)
  workflow_dispatch:      # Allows manual trigger

# No repo write access needed anymore — data lives in Supabase, not git.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests python-dotenv supabase

      - name: Run script
        env:
          API_KEY: ${{ secrets.API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DEBUG: "false"
        run: python generate_ics.py
